[project]
name = "fa-bot"
version = "0.1.0"
description = "Freelance Careers Advisor: bot Telegram che cerca offerte freelance compatibili con il tuo CV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1.0",
    "python-telegram-bot[job-queue]>=22.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "httpx>=0.28.1",
]

[project.scripts]
fa-bot = "fa_bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
